members:
  - name: "Vladimir Milchakov, PhD"
    role: "Founder and CEO"
    affiliation: "Apex Qubits"
    bio: "Vladimir is an experimental physicist with more than ten years in superconducting quantum hardware. He completed his PhD at CNRS Institut Néel, Université Grenoble Alpes, in 2022. At IQM Quantum Computers he designed quantum processors and led the Qubit Coherence Project. At Alice & Bob he worked on what limits superconducting qubits in the lab. Since June 2026 he has been a Research Fellow in the Quantum Computing and Devices (QCD) group at Aalto University. At Apex Qubits he leads design, fabrication and the experimental roadmap to the first processor-level demonstrator."
    image: "images/vladimir.jpg"
    email: "founder@apexqubits.com"
  - name: "Cyril Mori, PhD"
    role: "Co-founder"
    affiliation: "CNRS, Institut Néel"
    bio: "Cyril is a quantum hardware specialist holding an engineering degree from Phelma (France) and a PhD in superconducting qubit systems. His doctoral research explored high-performance qubit design for state-of-the-art readout, as well as the study of error-inducing phenomena. He investigated their underlying mechanisms to suppress them and improve overall reliability. He is passionate about bridging the gap between fundamental quantum research and hardware engineering. He now works at CNRS on the pre-maturation project."
    image: "images/cyril.jpg"
    email: "info@apexqubits.com"
  - name: "Olivier Buisson, PhD"
    role: "Scientific Advisor"
    affiliation: "CNRS, Institut Néel, Directeur de Recherche (1st class)"
    bio: "Olivier is a Directeur de Recherche (1st class) at CNRS and a leading figure in superconducting quantum circuits. His work since the late 1990s has advanced circuit quantum electrodynamics, nonlinear superconducting devices, and quantum measurement, and has influenced how experiments achieve high-fidelity qubit control and readout. As scientific advisor, he provides the theoretical foundation and long-term perspective for the development of a new generation of quantum processors."
    image: "images/olivier.jpeg"
    email: "info@apexqubits.com"
